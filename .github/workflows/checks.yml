name: Checks
on:
  push:
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Train-Discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Train-Discovery/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
